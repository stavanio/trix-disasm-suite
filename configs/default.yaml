# DISASM-Bench Default Configuration
# Matches Table 11 (Appendix E)

training:
  total_timesteps: 2_000_000
  eval_interval: 50_000
  eval_episodes: 100
  random_seeds: [0, 42, 1234]
  control_frequency_hz: 100

policy:
  learning_rate: 3.0e-4
  discount_gamma: 0.99
  gae_lambda: 0.95
  batch_size: 2048
  buffer_size: 1_000_000
  network: [256, 256]
  activation: relu

ppo_lagrangian:
  lr_lagrange: 3.5e-2

reward:
  alpha_progress: 1.0
  beta_violation: 10.0
  lambda_energy: 1.0e-3
  r_success: 100.0

stress_tournament:
  episodes_per_task: 100_000
  # Out-of-distribution ranges (wider than training)
  screw_pitch_range: [0.8, 2.0]  # training: [1.0, 1.5]
  battery_viscosity_range: [3.0, 20.0]  # training: [5, 15]

physical_constants:
  force_noise_std: 1.235  # N
  torque_noise_std: 0.039  # Nm
  position_noise_std: 0.001  # m
  velocity_noise_std: 0.01  # m/s
  angular_vel_noise_std: 0.05  # rad/s
  integration_dt: 0.004167  # 1/240 Hz
  control_dt: 0.01  # 1/100 Hz
